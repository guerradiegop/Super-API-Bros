name: Windows installer with bundled Java
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.bat'
      - 'scripts/package-windows.ps1'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-installer-main
  cancel-in-progress: true
jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          architecture: x64
      - name: Build, test and package standalone installer
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version "1.0.${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: RedeDosHorizontes-Windows-x64
          path: installers/
          if-no-files-found: error
      - name: Commit installer beside the source on main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch main.' }
          $latest = (git rev-parse origin/main).Trim()
          if ($latest -ne $env:GITHUB_SHA) { throw 'Main changed during packaging; refusing to publish an outdated installer.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- installers/RedeDosHorizontes-Windows-x64.exe installers/SHA256SUMS.txt installers/build-info.json dist/super-api-bros.jar
          if ($LASTEXITCODE -ne 0) { throw 'Cannot stage installer.' }
          git commit -m 'Publish Windows installer with bundled Java [skip ci]'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot commit installer.' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Cannot publish installer to main.' }
